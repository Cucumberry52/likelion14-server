x-petclinic: &petclinic
  image: spring-petclinic:study
  init: true
  restart: unless-stopped
  mem_limit: 1g
  cpus: 1.0
  environment: &petclinic-env
    SPRING_PROFILES_ACTIVE: postgres
    SPRING_SQL_INIT_MODE: never
    POSTGRES_URL: jdbc:postgresql://postgres:5432/petclinic
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "5000"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"[http.server.requests]":true}}}}}'
    SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
    SERVER_TOMCAT_BASEDIR: /tmp/tomcat
  depends_on:
    postgres:
      condition: service_healthy
  networks: [proxy-net, db-net]

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./src/main/resources/db/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/postgres/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "petclinic", "-d", "petclinic"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [db-net]

  app1:
    <<: *petclinic
    build: .
    environment:
      <<: *petclinic-env
      STUDY_INSTANCE: app1
    volumes:
      - ./logs/tomcat/app1:/tmp/tomcat

  app2:
    <<: *petclinic
    pull_policy: never
    environment:
      <<: *petclinic-env
      STUDY_INSTANCE: app2
    volumes:
      - ./logs/tomcat/app2:/tmp/tomcat

  nginx:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/study-normal.conf:/etc/nginx/study-mode.conf:ro
      - nginx-access:/var/log/study
      - ./nginx/study-50x.html:/usr/share/nginx/html/study-50x.html:ro
    depends_on: [app1, app2]
    networks: [proxy-net]

  nginx-metrics:
    image: python:3.13-alpine
    command: ["python", "/app/exporter.py"]
    volumes:
      - ./monitoring/nginx-metrics/exporter.py:/app/exporter.py:ro
      - nginx-access:/var/log/study:ro
    networks: [proxy-net]

  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [proxy-net]

  grafana:
    image: grafana/grafana:11.5.1
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [proxy-net]

  k6:
    image: grafana/k6:latest
    profiles: [load]
    volumes:
      - ./k6:/scripts
    environment:
      BASE_URL: http://nginx:80
    networks: [proxy-net]

networks:
  proxy-net:
  db-net:
    internal: true

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  nginx-access:
