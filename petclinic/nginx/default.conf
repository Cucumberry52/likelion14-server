log_format study 'time=$time_iso8601 status=$status method=$request_method '
                 'uri="$request_uri" cache=$upstream_cache_status '
                 'rate_limit=$limit_req_status request_time=$request_time '
                 'upstream_connect=$upstream_connect_time '
                 'upstream_header=$upstream_header_time '
                 'upstream_time=$upstream_response_time upstream="$upstream_addr"';
log_format study_status $status;
limit_req_zone $binary_remote_addr zone=study_rate:10m rate=5r/s;
error_log /dev/stderr notice;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=petclinic_cache:10m
                 inactive=10m max_size=100m use_temp_path=off;

upstream petclinic_backend {
  zone petclinic_backend 64k;
  resolver 127.0.0.11 valid=2s ipv6=off;
  server app1:8080 max_fails=1 fail_timeout=10s resolve;
  server app2:8080 max_fails=1 fail_timeout=10s resolve;
}
server {
  listen 80;
  access_log /dev/stdout study;
  access_log /var/log/study/status.log study_status;

  server_tokens off;
  add_header X-Upstream $upstream_addr always;
  include /etc/nginx/study-mode.conf;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~* \.(?:css|js|png|jpe?g|gif|svg|ico)$ {
    proxy_pass http://petclinic_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache petclinic_cache;
    proxy_cache_valid 200 5m;
    proxy_cache_methods GET HEAD;
    proxy_cache_bypass $arg_bypass_cache;
    proxy_no_cache $arg_bypass_cache;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  error_page 502 503 504 /study-50x.html;

  location = /study-50x.html {
    root /usr/share/nginx/html;
    internal;
  }

  location = /study/read-only {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 204;
  }

  location = /study/private {
    return 403;
  }

  location / {
    proxy_intercept_errors on;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_pass http://petclinic_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
